<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--pba-bg);color:var(--pba-fg);font-family:var(--pba-font-body)}
  .wrap{padding:22px 24px;display:flex;flex-direction:column;gap:18px}
  .row{display:flex;align-items:center;gap:18px}
  .meta{width:120px;font-family:var(--pba-font-pixel);font-size:7px;color:var(--pba-fg-5);letter-spacing:0.1em;flex:none}
  .meta b{color:var(--pba-gold);font-weight:normal}
  .logo{font-family:var(--pba-font-pixel);font-size:14px;color:var(--pba-gold);letter-spacing:0.05em}
  .logo .by{color:#fff}
  .btn{font-family:var(--pba-font-pixel);font-size:10px;color:#000;background:var(--pba-gold);padding:10px 14px;letter-spacing:0.1em;display:inline-block}
  .eye{font-family:var(--pba-font-pixel);font-size:8px;color:var(--pba-gold);letter-spacing:0.2em}
  .mic{font-family:var(--pba-font-pixel);font-size:6.5px;color:var(--pba-fg-4);letter-spacing:0.1em}
</style></head><body>
<div class="wrap">
  <div class="row"><div class="meta"><b>LOGO</b><br>14PX · LS 0.05</div><div class="logo">picked<span class="by">by</span>.ai</div></div>
  <div class="row"><div class="meta"><b>BUTTON</b><br>10PX · LS 0.1</div><span class="btn">CHECK SCORE</span></div>
  <div class="row"><div class="meta"><b>EYEBROW</b><br>8PX · LS 0.2</div><span class="eye">HOW IT WORKS</span></div>
  <div class="row"><div class="meta"><b>METRIC</b><br>6.5PX · LS 0.1</div><span class="mic">QUERIES PROBED · 24 / 50</span></div>
</div>
</body></html>
