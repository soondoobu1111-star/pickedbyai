<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--pba-bg);color:var(--pba-fg);font-family:var(--pba-font-body);height:100%}
  .wrap{padding:20px 24px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;height:100%;box-sizing:border-box}
  .mark{width:110px;height:110px;background:#000;border:1px solid var(--pba-border);display:grid;place-items:center}
  .mark img{width:72px;height:72px;image-rendering:pixelated}
  .info{display:flex;flex-direction:column;gap:10px}
  .logo-text{font-family:var(--pba-font-pixel);font-size:18px;color:var(--pba-gold);letter-spacing:0.05em}
  .logo-text .by{color:#fff}
  .tagline{font-size:12px;color:var(--pba-fg-3);max-width:440px;line-height:1.5}
  .sizes{display:flex;align-items:flex-end;gap:18px;margin-top:4px}
  .sz{display:flex;flex-direction:column;align-items:center;gap:6px}
  .sz svg{image-rendering:pixelated;shape-rendering:crispEdges;display:block;background:#000}
  .sz span{font-family:var(--pba-font-pixel);font-size:7px;color:var(--pba-fg-5);letter-spacing:0.1em}
</style></head><body>
<div class="wrap">
  <div class="mark"><img src="../assets/logo-512.png" alt="pickedby.ai"></div>
  <div class="info">
    <div class="logo-text">picked<span class="by">by</span>.ai</div>
    <div class="tagline">Pixel-crown mark · Press Start 2P wordmark · gold (#FFD700) on pure black. The mark is the only bespoke SVG in the system.</div>
    <div class="sizes">
      <div class="sz">
        <svg width="16" height="16" viewBox="0 0 20 20" shape-rendering="crispEdges">
          <rect width="20" height="20" fill="#000"/>
          <g fill="#FFD700" transform="translate(0,2)">
            <rect x="0" y="0" width="2" height="4"/><rect x="9" y="0" width="2" height="4"/><rect x="18" y="0" width="2" height="4"/>
            <rect x="0" y="4" width="20" height="2"/>
            <rect x="0" y="6" width="2" height="6"/><rect x="18" y="6" width="2" height="6"/>
            <rect x="4" y="8" width="2" height="2"/><rect x="9" y="8" width="2" height="2"/><rect x="14" y="8" width="2" height="2"/>
            <rect x="0" y="12" width="20" height="2"/>
            <rect x="2" y="14" width="16" height="2"/>
          </g>
        </svg>
        <span>16</span>
      </div>
      <div class="sz">
        <svg width="24" height="24" viewBox="0 0 20 20" shape-rendering="crispEdges">
          <rect width="20" height="20" fill="#000"/>
          <g fill="#FFD700" transform="translate(0,2)">
            <rect x="0" y="0" width="2" height="4"/><rect x="9" y="0" width="2" height="4"/><rect x="18" y="0" width="2" height="4"/>
            <rect x="0" y="4" width="20" height="2"/>
            <rect x="0" y="6" width="2" height="6"/><rect x="18" y="6" width="2" height="6"/>
            <rect x="4" y="8" width="2" height="2"/><rect x="9" y="8" width="2" height="2"/><rect x="14" y="8" width="2" height="2"/>
            <rect x="0" y="12" width="20" height="2"/>
            <rect x="2" y="14" width="16" height="2"/>
          </g>
        </svg>
        <span>24</span>
      </div>
      <div class="sz">
        <svg width="40" height="40" viewBox="0 0 20 20" shape-rendering="crispEdges">
          <rect width="20" height="20" fill="#000"/>
          <g fill="#FFD700" transform="translate(0,2)">
            <rect x="0" y="0" width="2" height="4"/><rect x="9" y="0" width="2" height="4"/><rect x="18" y="0" width="2" height="4"/>
            <rect x="0" y="4" width="20" height="2"/>
            <rect x="0" y="6" width="2" height="6"/><rect x="18" y="6" width="2" height="6"/>
            <rect x="4" y="8" width="2" height="2"/><rect x="9" y="8" width="2" height="2"/><rect x="14" y="8" width="2" height="2"/>
            <rect x="0" y="12" width="20" height="2"/>
            <rect x="2" y="14" width="16" height="2"/>
          </g>
        </svg>
        <span>40</span>
      </div>
      <div class="sz">
        <svg width="64" height="64" viewBox="0 0 20 20" shape-rendering="crispEdges">
          <rect width="20" height="20" fill="#000"/>
          <g fill="#FFD700" transform="translate(0,2)">
            <rect x="0" y="0" width="2" height="4"/><rect x="9" y="0" width="2" height="4"/><rect x="18" y="0" width="2" height="4"/>
            <rect x="0" y="4" width="20" height="2"/>
            <rect x="0" y="6" width="2" height="6"/><rect x="18" y="6" width="2" height="6"/>
            <rect x="4" y="8" width="2" height="2"/><rect x="9" y="8" width="2" height="2"/><rect x="14" y="8" width="2" height="2"/>
            <rect x="0" y="12" width="20" height="2"/>
            <rect x="2" y="14" width="16" height="2"/>
          </g>
        </svg>
        <span>64</span>
      </div>
    </div>
  </div>
</div>
</body></html>
