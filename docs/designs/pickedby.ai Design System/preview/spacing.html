<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--pba-bg);color:var(--pba-fg);font-family:var(--pba-font-body)}
  .wrap{padding:20px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;align-items:center;gap:14px}
  .bar{height:14px;background:#141414;border:1px solid #222}
  .fill{height:100%}
  .lab{font-family:var(--pba-font-pixel);font-size:7px;color:var(--pba-fg-4);letter-spacing:0.1em;width:70px;flex:none}
  .px{font-family:var(--pba-font-mono);font-size:11px;color:var(--pba-fg-5);width:54px}
</style></head><body>
<div class="wrap">
  <div class="row"><div class="lab">SP-2</div><div class="bar" style="width:8px"></div><div class="px">8px</div><div style="color:var(--pba-fg-3);font-size:12px">row gap · inline pad</div></div>
  <div class="row"><div class="lab">SP-3</div><div class="bar" style="width:12px"></div><div class="px">12px</div><div style="color:var(--pba-fg-3);font-size:12px">compact stack</div></div>
  <div class="row"><div class="lab">SP-4</div><div class="bar" style="width:16px"></div><div class="px">16px</div><div style="color:var(--pba-fg-3);font-size:12px">card inner padding</div></div>
  <div class="row"><div class="lab">SP-6</div><div class="bar" style="width:24px"></div><div class="px">24px</div><div style="color:var(--pba-fg-3);font-size:12px">between sections</div></div>
  <div class="row"><div class="lab">SP-8</div><div class="bar" style="width:32px"></div><div class="px">32px</div><div style="color:var(--pba-fg-3);font-size:12px">landing card padding</div></div>
  <div class="row"><div class="lab">SP-12</div><div class="bar" style="width:48px"></div><div class="px">48px</div><div style="color:var(--pba-fg-3);font-size:12px">page section break</div></div>
</div>
</body></html>
