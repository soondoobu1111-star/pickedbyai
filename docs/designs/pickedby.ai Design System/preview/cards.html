<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--pba-bg);color:var(--pba-fg);font-family:var(--pba-font-body)}
  .wrap{padding:22px;display:flex;gap:18px;height:240px;box-sizing:border-box}
  .card{flex:1;background:#141414;border:1px solid var(--pba-border);padding:18px;position:relative;display:flex;flex-direction:column;gap:10px}
  .card::before{content:'';position:absolute;top:-1px;left:-1px;width:10px;height:10px;background:var(--pba-gold)}
  .card::after{content:'';position:absolute;bottom:-1px;right:-1px;width:6px;height:6px;background:#2a2a2a}
  .eye{font-family:var(--pba-font-pixel);font-size:7px;color:var(--pba-gold);letter-spacing:0.2em}
  .tl{font-family:var(--pba-font-body);font-weight:700;color:#fff;font-size:15px}
  .b{color:var(--pba-fg-3);font-size:12px;line-height:1.55}
  .metric{font-family:var(--pba-font-body);font-weight:800;font-size:28px;color:var(--pba-gold);letter-spacing:-0.5px;line-height:1}
  .ml{font-family:var(--pba-font-pixel);font-size:6px;color:var(--pba-fg-5);letter-spacing:0.15em;margin-top:4px}
  .dash{border-radius:8px;padding:16px}
  .dash::before{display:none}
  .dash::after{display:none}
  .dash-lab{font-family:var(--pba-font-pixel);font-size:6.5px;color:var(--pba-fg-5);letter-spacing:0.1em;margin-bottom:6px}
</style></head><body>
<div class="wrap">
  <div class="card">
    <div class="eye">✦ WITH PIXEL CORNERS</div>
    <div class="tl">Landing card</div>
    <div class="b">Zero radius, 10×10 gold corner top-left, 6×6 grey corner bottom-right. The signature repeated detail.</div>
  </div>
  <div class="card dash">
    <div class="dash-lab">DASHBOARD CARD</div>
    <div class="metric">87<span style="font-size:16px;color:var(--pba-fg-4);font-weight:600">/100</span></div>
    <div class="ml">AI VISIBILITY SCORE</div>
    <div class="b" style="margin-top:6px">8px radius · no pixel corners · compact padding.</div>
  </div>
</div>
</body></html>
