<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--pba-bg);color:var(--pba-fg);font-family:var(--pba-font-body)}
  .wrap{padding:20px 24px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--pba-border-faint);padding-bottom:10px}
  .row:last-child{border-bottom:none}
  .meta{width:120px;font-family:var(--pba-font-pixel);font-size:7px;color:var(--pba-fg-5);letter-spacing:0.1em;flex:none}
  .meta b{color:var(--pba-gold);font-weight:normal}
</style></head><body>
<div class="wrap">
  <div class="row"><div class="meta"><b>H1</b><br>INTER 800 · 36PX</div><h1 class="pba-h1" style="margin:0">Does AI recommend your product?</h1></div>
  <div class="row"><div class="meta"><b>H2</b><br>INTER 700 · 18PX</div><h2 class="pba-h2" style="margin:0">Your AI Visibility Score</h2></div>
  <div class="row"><div class="meta"><b>BODY</b><br>INTER 400 · 14.7PX</div><p class="pba-body" style="margin:0">AI recommendations are dynamic. No tool can guarantee placement — but you can measure and improve.</p></div>
  <div class="row"><div class="meta"><b>MUTED</b><br>INTER 400 · 13PX</div><p class="pba-muted" style="margin:0">Methodology · Last updated 3 days ago</p></div>
</div>
</body></html>
