<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--pba-bg);color:var(--pba-fg);font-family:var(--pba-font-body)}
  .wrap{padding:20px;display:flex;gap:14px;align-items:center;justify-content:center;height:190px;box-sizing:border-box}
  .r{flex:1;aspect-ratio:1;background:#141414;border:1px solid var(--pba-border);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box}
  .name{font-family:var(--pba-font-pixel);font-size:7px;color:var(--pba-fg-4);letter-spacing:0.1em}
  .px{font-family:var(--pba-font-mono);font-size:10px;color:var(--pba-fg-2);margin-top:3px}
  .note{color:var(--pba-gold);font-family:var(--pba-font-pixel);font-size:6.5px;letter-spacing:0.1em;margin-top:4px}
</style></head><body>
<div class="wrap">
  <div class="r" style="border-radius:0"><div class="name">R-0</div><div class="px">0px</div><div class="note">LANDING</div></div>
  <div class="r" style="border-radius:4px"><div class="name">R-1</div><div class="px">4px</div><div class="note">CHIP</div></div>
  <div class="r" style="border-radius:6px"><div class="name">R-2</div><div class="px">6px</div><div class="note">INPUT</div></div>
  <div class="r" style="border-radius:8px"><div class="name">R-3</div><div class="px">8px</div><div class="note">APP CARD</div></div>
  <div class="r" style="border-radius:12px"><div class="name">R-4</div><div class="px">12px</div><div class="note">MODAL</div></div>
  <div class="r" style="border-radius:999px;align-items:center;justify-content:center;text-align:center"><div class="name">PILL</div><div class="px">999</div><div class="note">PROG BAR</div></div>
</div>
</body></html>
