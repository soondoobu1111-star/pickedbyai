<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 1200px; background: #0a0a0a; color: #f5f5f5; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 80px;
    position: relative;
  }
  /* gold pixel border */
  body::before {
    content: ''; position: absolute; inset: 40px;
    border: 3px solid #FFD700;
    box-shadow: 6px 6px 0 #b39700;
    pointer-events: none;
  }
  .corner {
    position: absolute;
    width: 24px; height: 24px;
    background: #FFD700;
  }
  .c1 { top: 28px; left: 28px; }
  .c2 { top: 28px; right: 28px; }
  .c3 { bottom: 28px; left: 28px; }
  .c4 { bottom: 28px; right: 28px; }

  .eyebrow {
    font-family: 'Press Start 2P', monospace;
    font-size: 22px;
    color: #FFD700;
    letter-spacing: 4px;
    margin-bottom: 60px;
    text-shadow: 3px 3px 0 #b39700;
  }
  .stat {
    font-family: 'Press Start 2P', monospace;
    color: #FFD700;
    text-shadow: 6px 6px 0 #b39700;
    line-height: 1.3;
    text-align: center;
  }
  .stat-1 { font-size: 88px; margin-bottom: 36px; }
  .stat-2 { font-size: 72px; color: #f5f5f5; text-shadow: 6px 6px 0 #444; margin-bottom: 80px; }

  .live {
    font-family: 'Press Start 2P', monospace;
    font-size: 22px;
    color: #4ade80;
    letter-spacing: 4px;
    margin-bottom: 12px;
  }

  .brand {
    position: absolute;
    bottom: 60px;
    font-family: 'Press Start 2P', monospace;
    font-size: 18px;
    color: #555;
    letter-spacing: 3px;
  }
</style>
</head>
<body>
  <div class="corner c1"></div>
  <div class="corner c2"></div>
  <div class="corner c3"></div>
  <div class="corner c4"></div>

  <div class="eyebrow">DAY 24 — SHIPPED</div>
  <div class="stat stat-1">33 BUGS<br>FOUND</div>
  <div class="stat stat-2">426 LINES<br>DELETED</div>
  <div class="live">PRODUCTION LIVE</div>

  <div class="brand">PICKEDBY.AI</div>
</body>
</html>
