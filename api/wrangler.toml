name = "pickedbyai-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
# 스테이징과 동일: dailyRefresh(KST 00:01) + retry queue(매 1분)
# 2026-04-29 CRON-CONFLICT-FIX 적용: 1분 오프셋으로 충돌 방지
crons = ["1 15 * * *", "* * * * *"]

[placement]
mode = "smart"

[vars]
ENVIRONMENT = "production"
UNIFIED_SCORE_V15 = "true"      # 빅파이 1.5 Phase 1 — 4차원 스코어 활성화 (스테이징 검증 완료)
PROBE_REDESIGN_D7 = "true"      # D7 역방향 스무고개 프로브 활성화 (스테이징 검증 완료)
TURNSTILE_BYPASS = "0"          # D11: CEO CF Turnstile 사이트키 등록 완료 → 활성화 (이전 "1")
TURNSTILE_SITE_KEY = "0x4AAAAAADBlxvGJj8SRz5Oo"  # 프로덕션 Turnstile 사이트키

[env.staging]
name = "pickedbyai-api-staging"

[env.staging.triggers]
# T5 D2 RETRY-01: 일일 refresh + 매 1분 retry queue 처리 (1분 × 5회 = 총 5분)
# 2026-04-21 CEO 승인: dailyRefresh 시각 UTC 02:00 → UTC 15:00 (= KST 00:00 자정)
# 2026-04-22 CRON-CONFLICT-FIX: "0 15 * * *" 와 "* * * * *" 가 UTC 15:00:00 정각 동시 매칭 →
# CF Workers가 event.cron에 "* * * * *"만 전달하여 retry queue만 실행 + dailyRefresh 누락 확인됨.
# 1분 오프셋 "1 15 * * *" (= KST 00:01)로 충돌 완전 회피.
crons = ["1 15 * * *", "* * * * *"]

[env.staging.vars]
ENVIRONMENT = "staging"
SUPABASE_URL = "https://xzecybljfipmmzzzfnit.supabase.co"
UNIFIED_SCORE_V15 = "true"    # 빅파이 1.5 Phase 1 Step 3 — 스테이징만 병기. 프로덕션은 절대 활성화 금지(CEO 승인 필요)
PROBE_REDESIGN_D7 = "true"   # D7 역방향 스무고개 프로브 — 스테이징만 활성. UNIFIED_SCORE_V15와 함께 사용
GEMINI_RELAY_URL = "https://pickedbyai-gemini-relay-staging.perceptdot.workers.dev/relay"  # 수정된 staging relay (gemini-2.0-flash, thinkingConfig 제거)
TURNSTILE_BYPASS = "0"        # 스테이징: Turnstile 활성화 (2026-04-27 staging-0404.pickedby.ai 도메인 등록 완료)
TURNSTILE_SITE_KEY = "0x4AAAAAADBlxvGJj8SRz5Oo"  # 실제 사이트키 (prod 위젯과 동일)

[env.staging.placement]
mode = "smart"

[env.staging.ai]
binding = "AI"

[[env.staging.services]]
binding = "GEMINI_RELAY"
service = "pickedbyai-gemini-relay-staging"

[ai]
binding = "AI"

[[services]]
binding = "GEMINI_RELAY"
service = "pickedbyai-gemini-relay"

# Secrets (wrangler secret put으로 설정):
# - BREVO_API_KEY
# - SUPABASE_ANON_KEY
# - SUPABASE_SERVICE_KEY
# - TAVILY_API_KEY
# - PERPLEXITY_API_KEY   (kw-key.sh load perplexity)
# - OPENAI_API_KEY       (kw-key.sh load openai)
# - GEMINI_API_KEY       (kw-key.sh load pickedbyai)
# - GROQ_API_KEY
# - TURNSTILE_SECRET     (D9b: CEO가 CF Dashboard → Turnstile → Add Site 등록 후 발급)
#   스테이징: npx wrangler secret put TURNSTILE_SECRET --env staging
#   프로덕션: npx wrangler secret put TURNSTILE_SECRET

# Custom domain: api.pickedby.ai
# → CF Dashboard > Workers > pickedbyai-api > Settings > Domains & Routes > Add Custom Domain
