name = "pickedbyai-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 15 * * *"]  # 매일 15:00 UTC (= KST 00:00 자정) 자동 스캔 — 2026-04-21 CEO 승인

[placement]
mode = "smart"

[vars]
ENVIRONMENT = "production"

[env.staging]
name = "pickedbyai-api-staging"

[env.staging.triggers]
# T5 D2 RETRY-01: 일일 refresh + 매 1분 retry queue 처리 (1분 × 5회 = 총 5분)
# 2026-04-21 CEO 승인: dailyRefresh 시각 UTC 02:00 → UTC 15:00 (= KST 00:00 자정)
crons = ["0 15 * * *", "* * * * *"]

[env.staging.vars]
ENVIRONMENT = "staging"
SUPABASE_URL = "https://xzecybljfipmmzzzfnit.supabase.co"
UNIFIED_SCORE_V15 = "true"  # 빅파이 1.5 Phase 1 Step 3 — 스테이징만 병기. 프로덕션은 절대 활성화 금지(CEO 승인 필요)
GEMINI_RELAY_URL = "https://pickedbyai-gemini-relay-staging.perceptdot.workers.dev/relay"  # 수정된 staging relay (gemini-2.0-flash, thinkingConfig 제거)

[env.staging.placement]
mode = "smart"

[env.staging.ai]
binding = "AI"

[[env.staging.services]]
binding = "GEMINI_RELAY"
service = "pickedbyai-gemini-relay-staging"

[ai]
binding = "AI"

[[services]]
binding = "GEMINI_RELAY"
service = "pickedbyai-gemini-relay"

# Secrets (wrangler secret put으로 설정):
# - BREVO_API_KEY
# - SUPABASE_ANON_KEY
# - SUPABASE_SERVICE_KEY
# - TAVILY_API_KEY
# - PERPLEXITY_API_KEY   (kw-key.sh load perplexity)
# - OPENAI_API_KEY       (kw-key.sh load openai)
# - GEMINI_API_KEY       (kw-key.sh load pickedbyai)
# - GROQ_API_KEY

# Custom domain: api.pickedby.ai
# → CF Dashboard > Workers > pickedbyai-api > Settings > Domains & Routes > Add Custom Domain
