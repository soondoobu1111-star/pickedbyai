name = "pickedbyai-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 2 * * *"]  # 매일 02:00 UTC (11:00 KST) 자동 스캔

[placement]
mode = "smart"

[vars]
ENVIRONMENT = "production"

[env.staging]
name = "pickedbyai-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"

[env.staging.placement]
mode = "smart"

[env.staging.ai]
binding = "AI"

[ai]
binding = "AI"

# Secrets (wrangler secret put으로 설정):
# - BREVO_API_KEY
# - SUPABASE_ANON_KEY
# - SUPABASE_SERVICE_KEY
# - TAVILY_API_KEY
# - PERPLEXITY_API_KEY   (kw-key.sh load perplexity)
# - OPENAI_API_KEY       (kw-key.sh load openai)
# - GEMINI_API_KEY       (kw-key.sh load pickedbyai)
# - GROQ_API_KEY

# Custom domain: api.pickedby.ai
# → CF Dashboard > Workers > pickedbyai-api > Settings > Domains & Routes > Add Custom Domain
